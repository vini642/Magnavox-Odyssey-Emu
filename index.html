<!DOCTYPE html>
<html>
<head>
  <title>3DS Website</title>

  <style>
    body {
      background-color: #1a1a2e;
      color: white;
      font-family: Arial;
      text-align: center;
      margin-top: 40px;
    }

    .box {
      background-color: #222244;
      border: 3px solid #6666ff;
      width: 260px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      color: #66ccff;
      font-size: 28px;
    }

    p {
      font-size: 14px;
    }

    button {
      background-color: #4444aa;
      color: white;
      border: 2px solid #8888ff;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      width: 180px;
    }

    button:active {
      background-color: #6666ff;
    }

    #clock {
      margin-top: 15px;
      color: #aaccff;
      font-size: 14px;
    }

    .star {
      color: yellow;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="star">★ ★ ★</div>

    <h1>Hello, World!</h1>

    <p>Welcome to my 3DS-compatible website :)</p>

    <button onclick="helloButton()">
      Click Me!
    </button>

    <div id="clock"></div>

  </div>

  <script>
    function helloButton() {
      alert("Hello from the Nintendo 3DS! :D");
    }

    function updateClock() {
      var now = new Date();

      var time =
        now.getHours() + ":" +
        addZero(now.getMinutes()) + ":" +
        addZero(now.getSeconds());

      document.getElementById("clock").innerHTML = time;
    }

    function addZero(num) {
      if (num < 10) {
        return "0" + num;
      }
      return num;
    }

    setInterval(updateClock, 1000);

    updateClock();
  </script>

</body>
</html>
