<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Website</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937, #312e81);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.08);
      padding: 40px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      animation: rainbow 5s linear infinite;
    }

    p {
      opacity: 0.8;
      margin-bottom: 25px;
    }

    button {
      background: linear-gradient(45deg, #06b6d4, #8b5cf6);
      border: none;
      padding: 15px 25px;
      color: white;
      font-size: 1rem;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 15px rgba(139,92,246,0.5);
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(139,92,246,0.9);
    }

    #clock {
      margin-top: 20px;
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      opacity: 0.2;
      animation: drift linear infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes rainbow {
      0% { color: #60a5fa; }
      25% { color: #c084fc; }
      50% { color: #34d399; }
      75% { color: #f472b6; }
      100% { color: #60a5fa; }
    }

    @keyframes drift {
      from {
        transform: translateY(100vh) scale(0);
      }
      to {
        transform: translateY(-10vh) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Hello, World! ✨</h1>

    <p>Welcome to your awesome website.</p>

    <button onclick="magicButton()">
      Click Me :)
    </button>

    <div id="clock"></div>
  </div>

  <script>
    function magicButton() {
      const messages = [
        "hello! 👋",
        "you clicked the button 😎",
        "beep boop 🤖",
        "have a nice day ✨",
        "you found the secret button power 🌟"
      ];

      const random =
        messages[Math.floor(Math.random() * messages.length)];

      alert(random);
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText =
        now.toLocaleTimeString();
    }

    setInterval(updateClock, 1000);
    updateClock();

    // floating particles
    for (let i = 0; i < 40; i++) {
      const p = document.createElement("div");
      p.classList.add("particle");

      p.style.left = Math.random() * 100 + "vw";
      p.style.animationDuration =
        (Math.random() * 10 + 5) + "s";

      p.style.width = p.style.height =
        (Math.random() * 8 + 2) + "px";

      document.body.appendChild(p);
    }
  </script>

</body>
</html>
